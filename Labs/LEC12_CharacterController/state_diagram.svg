<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title description">
  <title id="title">Boy character state diagram</title>
  <desc id="description">Idle transitions to AutoRun with A. AutoRun returns to Idle after five seconds, or transitions to Run when a direction key is pressed. AutoRun reverses direction at screen edges. Releasing direction keys in Run returns to Idle.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Noto Sans KR", sans-serif; fill: #172033; }
      .state { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
      .transition { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .label { font-size: 19px; font-weight: 600; }
      .small { font-size: 16px; }
    </style>
  </defs>
  <rect width="1000" height="580" rx="18" fill="#ffffff"/>
  <text x="500" y="52" text-anchor="middle" font-size="28" font-weight="700">Boy Character State Diagram</text>

  <rect class="state" x="85" y="230" width="190" height="92" rx="18"/>
  <text class="label" x="180" y="284" text-anchor="middle">IDLE</text>

  <rect class="state" x="405" y="105" width="220" height="110" rx="18"/>
  <text class="label" x="515" y="153" text-anchor="middle">AUTO_RUN</text>
  <text class="small" x="515" y="184" text-anchor="middle">Fast + enlarged</text>

  <rect class="state" x="725" y="230" width="190" height="92" rx="18"/>
  <text class="label" x="820" y="284" text-anchor="middle">RUN</text>

  <path class="transition" d="M230 230 C280 175, 340 145, 405 150"/>
  <text class="small" x="316" y="165" text-anchor="middle">A key</text>

  <path class="transition" d="M405 185 C350 250, 305 275, 275 275"/>
  <text class="small" x="347" y="248" text-anchor="middle">5 seconds</text>

  <path class="transition" d="M625 160 C685 160, 715 205, 755 230"/>
  <text class="small" x="704" y="170" text-anchor="middle">Left / Right</text>

  <path class="transition" d="M725 300 C610 395, 350 395, 240 322"/>
  <text class="small" x="485" y="385" text-anchor="middle">Direction key released</text>

  <path class="transition" d="M520 105 C480 45, 600 45, 560 105"/>
  <text class="small" x="540" y="83" text-anchor="middle">Screen edge: reverse</text>
</svg>
